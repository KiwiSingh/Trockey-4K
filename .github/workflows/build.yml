name: Build Trockey 4K

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install pygame py2app
      - name: Convert PNG to ICNS
        run: sips -s format icns trockey_app_icon.png --out app_icon.icns
      - name: Build macOS App
        run: python setup.py py2app
      - name: Zip for Upload
        run: cd dist && zip -r Trockey4K-macOS.zip "Trockey 4K.app"
      - name: Upload macOS Build
        uses: actions/upload-artifact@v4
        with:
          name: Trockey4K-macOS
          path: dist/Trockey4K-macOS.zip

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install pygame pyinstaller pillow
      - name: Convert PNG to ICO
        run: python -c "from PIL import Image; Image.open('trockey_app_icon.png').save('app_icon.ico')"
      - name: Build Windows Exe
        # Notice the semicolon ';' separator for Windows data files
        run: pyinstaller --noconsole --onedir --name "Trockey 4K" --icon=app_icon.ico --add-data "*.wav;." --add-data "*.mp3;." main.py
      - name: Upload Windows Build
        uses: actions/upload-artifact@v4
        with:
          name: Trockey4K-Windows
          path: dist/Trockey 4K

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install System & Python Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk
          pip install pygame pyinstaller
      - name: Build Linux Executable
        # Notice the colon ':' separator for Linux data files
        run: pyinstaller --noconsole --onedir --name "Trockey 4K" --add-data "*.wav:." --add-data "*.mp3:." main.py
      - name: Upload Linux Build
        uses: actions/upload-artifact@v4
        with:
          name: Trockey4K-Linux
          path: dist/Trockey 4K
